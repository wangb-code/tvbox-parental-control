<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#f6f8fb">
<title>极光盒子 · 家长控制</title>
<style>
:root{--bg:#f6f8fb;--card:#fff;--line:#e3e8ef;--txt:#1c2634;--muted:#6b7789;--blue:#2563eb;--blue-l:#eaf1ff;--amber:#b45309;--amber-l:#fff5e0;--green:#16794a;--green-l:#e6f6ed;--red:#b42318;--red-l:#fdecea}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--txt);font:15px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;padding:14px 14px 40px;max-width:560px;margin:auto}
header{display:flex;align-items:center;justify-content:space-between;margin:4px 2px 14px}
h1{font-size:19px;font-weight:600;margin:0}
.sub{font-size:12px;color:var(--muted);margin-top:2px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--red);margin-right:5px}
.dot.on{background:var(--green)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
.card h2{font-size:14px;font-weight:600;margin:0 0 12px;color:var(--muted);letter-spacing:.3px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--blue-l);border-radius:10px;padding:12px}
.stat .k{font-size:12px;color:var(--muted)}
.stat .v{font-size:26px;font-weight:600;color:var(--blue);margin-top:2px}
.stat .v small{font-size:13px;font-weight:400}
.note{margin-top:10px;font-size:13px;color:var(--muted)}
.bar{height:7px;background:#e9eef6;border-radius:6px;overflow:hidden;margin-top:12px}
.bar i{display:block;height:100%;background:var(--blue);border-radius:6px;transition:width .4s}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
button{font:inherit;color:var(--txt);background:#fff;border:1px solid var(--line);border-radius:10px;padding:13px 6px;cursor:pointer;transition:.12s;touch-action:manipulation}
button:active{transform:scale(.96);background:var(--blue-l)}
button.primary{background:var(--blue);color:#fff;border-color:var(--blue)}
button.warn{background:var(--amber-l);color:var(--amber);border-color:#f2dcae}
button.danger{background:var(--red-l);color:var(--red);border-color:#f6cfc9}
button.unlock{background:var(--green);color:#fff;border-color:var(--green)}
button.unlock:active{background:var(--green-l);color:var(--green)}
button.unlock:disabled{background:#c3cddd;border-color:#c3cddd;color:#fff;cursor:default;transform:none;opacity:.8}
button.big{font-size:17px;font-weight:600;padding:20px 8px}
.dpad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:260px;margin:0 auto}
.dpad button{height:58px;font-size:19px}
.dpad .ok{background:var(--blue-l);border-color:#c9dcff;color:var(--blue);font-size:14px;font-weight:600}
.pill{padding:4px 10px;border-radius:20px;font-size:12px;background:var(--green-l);color:var(--green)}
.pill.lock{background:var(--amber-l);color:var(--amber)}
.pill.red{background:var(--red-l);color:var(--red)}
label{display:block;font-size:13px;color:var(--muted);margin:12px 0 5px}
input[type=number],input[type=text],input[type=password],input[type=time],select{width:100%;font:inherit;padding:11px 12px;border:1px solid var(--line);border-radius:9px;background:#fff;color:var(--txt)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row>*{flex:1;min-width:110px}
.chk{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.chk label{display:flex;align-items:center;gap:6px;margin:0;background:#f2f5fa;border:1px solid var(--line);border-radius:9px;padding:9px 12px;color:var(--txt);font-size:14px}
.chk input{width:17px;height:17px;accent-color:var(--blue)}
.sw{display:flex;align-items:center;justify-content:space-between;padding:9px 0;font-size:14px}
.sw input{width:20px;height:20px;accent-color:var(--blue)}
.quiz{display:none;background:var(--amber-l);border-color:#f2dcae}
.quiz.show{display:block}
.qtext{font-size:25px;font-weight:600;line-height:1.45;margin:8px 0 18px;word-break:break-word}
.opt{font-size:18px;text-align:left;padding:16px 14px}
.opt b{color:var(--blue);margin-right:12px}
.hr{height:1px;background:var(--line);margin:16px 0}
.tiny{font-size:12px;color:var(--muted);line-height:1.6}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(80px);background:#1c2634;color:#fff;padding:11px 20px;border-radius:24px;font-size:14px;opacity:0;transition:.25s;z-index:9;white-space:nowrap}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:3px;background:#eef2f8;border:1px solid var(--line);border-radius:12px;padding:4px;margin:0 0 14px;position:relative;z-index:3}
.page{display:none}
.page.on{display:block}
.tabs button{font:inherit;font-size:12.5px;font-weight:600;color:var(--muted);background:transparent;border:0;border-radius:9px;padding:11px 1px;display:flex;align-items:center;justify-content:center;gap:3px;cursor:pointer;touch-action:manipulation;-webkit-user-select:none;user-select:none;white-space:nowrap}
.tabs button.on{background:#fff;color:var(--blue);box-shadow:0 1px 3px rgba(20,40,80,.10)}
.tabs button:active{transform:scale(.96)}
.openbtn{display:block;text-align:center;text-decoration:none;background:var(--blue);color:#fff;border-radius:10px;padding:14px;font-size:15px;font-weight:600;margin-top:12px}
.openbtn:active{background:#1d4ed8}
.volbar{display:block;height:8px;background:#e9eef6;border-radius:6px;overflow:hidden}
.volbar i{display:block;height:100%;background:var(--blue);border-radius:6px;transition:width .3s}
.volrow{display:flex;gap:8px;margin-top:8px}
.volrow button{flex:1;padding:9px 0;font-size:16px;line-height:1;border-radius:9px}
.sysrow{display:flex;align-items:center;gap:10px;margin-top:10px}
.sysrow .lb{font-size:12px;color:var(--muted);flex:0 0 44px}
.sysrow .vl{font-size:15px;font-weight:600;flex:0 0 auto}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin:0 0 10px}
.days label{display:flex;align-items:center;justify-content:center;gap:3px;font-size:12px;padding:9px 1px;border:1px solid var(--line);border-radius:9px;background:#fbfcfe;cursor:pointer;touch-action:manipulation}
.days input{width:14px;height:14px;accent-color:var(--green);margin:0}
</style>
</head>
<body>
<header>
  <div><h1>极光盒子 · 家长控制</h1><div class="sub">盒子本机运行 · 语音读题 / 遥控器答题 <a id="ver" href="/changelog" style="color:var(--green);text-decoration:none;border-bottom:1px dashed currentColor;cursor:pointer;touch-action:manipulation"></a></div></div>
  <div style="text-align:right"><div><span class="dot" id="dot"></span><span id="conn" style="font-size:12px">连接中</span></div><div class="sub" id="clock">--:--</div></div>
</header>

<nav class="tabs" id="tabsNav">
  <button type="button" class="on" data-tab="control">控制台</button>
  <button type="button" data-tab="remote">遥控器</button>
  <button type="button" data-tab="bank">题库</button>
  <button type="button" data-tab="settings">设置</button>
</nav>

<div class="page on" id="page-control">
<button class="primary" id="btnFindRemote" style="width:100%;font-size:18px;font-weight:600;padding:18px 8px;margin-bottom:6px">找遥控器 · 让遥控器响 10 秒</button>
<div class="tiny" style="margin-bottom:12px">让遥控器响 10 秒。</div>

<div class="grid2" style="margin-bottom:6px">
  <button class="danger" id="btnLock" style="font-size:16px;font-weight:600">一键锁定电视</button>
  <button class="unlock" id="btnUnlockAll" style="font-size:16px;font-weight:600" disabled>解锁电视</button>
</div>
<div class="tiny" id="unlockTip" style="margin-bottom:10px">当前无需解锁。</div>

<button class="warn" id="btnTimerPause" style="width:100%;font-size:16px;font-weight:600;padding:15px 8px;margin-bottom:6px">暂停计时（关电视 / 暂停时点一下）</button>
<div class="tiny" style="margin-bottom:14px">暂停 / 恢复计时。</div>
<div class="card">
  <h2>观看状态 <span class="pill" id="lockPill">观看中</span></h2>
  <div class="stats">
    <div class="stat"><div class="k">本次剩余</div><div class="v" id="sessionLeft">--<small> 分钟</small></div></div>
    <div class="stat"><div class="k">今日剩余</div><div class="v" id="todayLeft">--<small> 分钟</small></div></div>
  </div>
  <div class="bar"><i id="bar" style="width:0%"></i></div>
  <div class="note" id="note">--</div>
  <div class="tiny" id="subStatus" style="margin-top:8px">--</div>
  <div id="hardLockBox" style="display:none;margin-top:12px;padding:12px;border-radius:10px;background:var(--red-l);color:var(--red)">
    <div style="font-size:17px;font-weight:600" id="hardTitle">电视已锁定</div>
    <div style="font-size:14px;margin-top:6px" id="hardBody">--</div>
  </div>
</div>
<div class="card">
  <h2>盒子状态 <span class="pill" id="sysPill">--</span></h2>
  <div class="stats">
    <div class="stat"><div class="k">播放</div><div class="v" id="sysPlay" style="font-size:17px">--</div><div class="tiny" id="sysPlaySub">--</div></div>
    <div class="stat"><div class="k">计时</div><div class="v" id="sysTimer" style="font-size:17px">--</div><div class="tiny" id="sysTimerSub">--</div></div>
  </div>
  <div class="sysrow">
    <span class="lb" style="flex:0 0 52px">音量</span>
    <span id="sysVol" class="vl" style="flex:0 0 58px">--</span>
    <span class="volbar" style="flex:1"><i id="sysVolBar" style="width:0%"></i></span>
  </div>
  <div class="volrow">
    <button id="volDown">音量 −</button>
    <button id="volUp">音量 +</button>
  </div>
  <div class="hr"></div>
  <div class="sysrow">
    <span class="lb" style="flex:0 0 52px">网络</span>
    <span id="sysNet" class="vl" style="flex:1">--</span>
    <span id="sysIp" style="font-size:13px;color:var(--muted)">--</span>
  </div>
  <div class="sysrow" id="memRow" style="display:none">
    <span class="lb" style="flex:0 0 52px">内存</span>
    <span id="sysMem" class="vl" style="flex:0 0 auto;white-space:nowrap">--</span>
    <span class="volbar" style="flex:1"><i id="sysMemBar" style="width:0%;background:var(--green)"></i></span>
  </div>
  <div class="tiny" id="sysMemSub" style="margin-top:4px"></div>
  <div class="sysrow" id="trafficRow" style="display:none">
    <span class="lb" style="flex:0 0 52px">流量</span>
    <span id="sysTraffic" style="flex:1;font-size:14px;font-weight:600">--</span>
  </div>
  <div class="tiny" id="sysTrafficTotal" style="margin-top:4px"></div>
</div>
<div class="card" id="quizCard">
  <h2>休息时间 · 答对继续看 <span class="pill lock" id="quizSub"></span></h2>
  <div class="qtext" id="qtext"></div>
  <div class="grid2" id="opts"></div>
  <div class="note" id="quizTip">答对 2 题继续看</div>
  <button id="btnSpeak" style="width:100%;margin-top:12px">重播题目语音</button>
</div>

<div class="card">
  <h2>快捷操作</h2>
  <div class="grid3">
    <button id="btnQuiz">立即出一道题</button>
    <button id="btnReset">重置本轮计时</button>
    <button id="btnUnlock">跳过当前题目</button>
  </div>
</div>

</div>

<div class="page" id="page-remote">
<div class="card">
  <h2>遥控器</h2>
  <div class="grid2" style="margin-bottom:12px">
    <button data-key="POWER">电源</button>
    <button class="danger" id="btnReboot">重启盒子</button>
  </div>
  <div class="dpad">
    <span></span><button data-key="UP">▲</button><span></span>
    <button data-key="LEFT">◀</button><button class="ok" data-key="OK">确定</button><button data-key="RIGHT">▶</button>
    <span></span><button data-key="DOWN">▼</button><span></span>
  </div>
  <div class="grid3" style="margin-top:12px">
    <button data-key="BACK">返回</button><button data-key="HOME">主页</button><button data-key="MENU">菜单</button>
    <button data-key="VOL_UP">音量 +</button><button data-key="VOL_DOWN">音量 −</button><button data-key="MUTE">静音</button>
    <button data-key="REW">快退</button><button data-key="PLAY_PAUSE">播放/暂停</button><button data-key="FFWD">快进</button>
  </div>
  <div class="hr"></div>
  <label for="txt">文字输入</label>
  <div class="row"><input type="text" id="txt" placeholder="例如：tom"><button class="primary" id="sendTxt" style="flex:0 0 84px">发送</button></div>
</div>
</div>

<div class="page" id="page-settings">
<div class="card">
  <h2>设置</h2>
  <div class="row" style="margin-top:12px">
    <div><label>单次最多看（分钟）</label><input type="number" id="session" min="1" max="600" value="30"></div>
    <div><label>看完后休息（分钟）</label><input type="number" id="rest" min="1" max="600" value="60"></div>
  </div>
  <div class="row">
    <div><label>每日累计上限（分钟）</label><input type="number" id="daily" min="1" max="600" value="120"></div>
    <div><label>每隔多少分钟出一道题</label><input type="number" id="limit" min="1" max="600" value="5"></div>
  </div>
  <div class="hr"></div>
  <div class="tiny" style="margin-bottom:10px">出题类型与题目开关在「题库」页设置。</div>
  <div class="row">
    <div><label>重启时间</label><input type="time" id="rtime" value="01:00"></div>
    <div><label>每日上限恢复时间</label><input type="time" id="drtime" value="06:00"></div>
  </div>
  <label>重启日</label>
  <div class="days" id="days">
    <label><input type="checkbox" value="1">一</label>
    <label><input type="checkbox" value="2">二</label>
    <label><input type="checkbox" value="3">三</label>
    <label><input type="checkbox" value="4">四</label>
    <label><input type="checkbox" value="5">五</label>
    <label><input type="checkbox" value="6">六</label>
    <label><input type="checkbox" value="7">日</label>
  </div>
  <div class="sw"><span>定时重启</span><input type="checkbox" id="rebootOn" checked></div>
  <div class="sw"><span>时长限制</span><input type="checkbox" id="controlOn" checked></div>
  <div class="sw"><span>自动出题</span><input type="checkbox" id="quizOn" checked></div>
  <div class="sw"><span>朗读题目</span><input type="checkbox" id="voiceOn" checked></div>
  <div class="sw"><span>锁定语音</span><input type="checkbox" id="lockVoiceOn" checked></div>
  <div class="sw"><span>无播放不计时</span><input type="checkbox" id="pauseOnNoPlay" checked></div>
  <div class="hr"></div>
  <label>锁定界面天气</label>
  <div class="row">
    <div><label>城市</label><select id="weatherCity"></select></div>
    <div><label>当前</label><input type="text" id="weatherNow" readonly placeholder="--"></div>
  </div>
  <div class="row" style="margin-top:10px">
    <div><label>其他城市代码（9 位）</label><input type="text" id="weatherCode" placeholder="留空用上方城市"></div>
  </div>
  <div class="sw"><span>显示最近 7 天天气</span><input type="checkbox" id="weatherOn" checked></div>
  <div class="grid2" style="margin-top:10px">
    <button id="btnWeather">刷新天气</button>
    <button id="btnLockWeather">预览锁定界面</button>
  </div>
  <button class="primary" id="save" style="width:100%;margin-top:10px">保存设置</button>

</div>
</div>

<div id="toast"></div>
<script src="/common.js"></script>
<script>
var S={};
// LAN-only, passwordless control: no token/authentication layer.
function toast(m){var t=document.getElementById('toast');t.textContent=m;t.className='show';setTimeout(function(){t.className=''},1900)}
function post(p,d){return fetch(p,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(d||{})}).then(function(r){return r.json()})}
function mm(s){return Math.max(0,Math.round(s/60))}
// Both cards render from the SAME /api/status response (one refresh call).
// This single function produces the play/timer wording so they can't disagree.
function stateOf(s){
  var play=!!s.playing, paused=!!s.timer_paused, away=!!s.away_no_one_watching,
      hard=!!s.hard_locked, waiting=!!s.locked;
  var detail = hard?'电视已锁定':(away?'无人观看，已静音':
      (paused?'家长已暂停计时':(play?'有声音输出，正常计时':'没有播放，不计时')));
  var pill = hard?['已锁定','pill red']:(waiting?['等待答题','pill lock']:
      (play?['播放中','pill']:['待机','pill lock']));
  return {playText:play?'正在播放':'未播放',detail:detail,pill:pill,
          timerText:paused?'已暂停':(play?'计时中':'不计时')};
}
function fmtRate(b){
  if(b>=1048576)return (b/1048576).toFixed(1)+' MB/s';
  if(b>=1024)return (b/1024).toFixed(1)+' KB/s';
  return Math.round(b)+' B/s';
}
function fmtTotal(b){
  if(b>=1073741824)return (b/1073741824).toFixed(2)+' GB';
  if(b>=1048576)return (b/1048576).toFixed(1)+' MB';
  return (b/1024).toFixed(0)+' KB';
}
document.addEventListener('click',function(e){
  var k=e.target.getAttribute&&e.target.getAttribute('data-key');
  if(k){post('/api/key',{key:k});e.target.blur()}
});
document.getElementById('sendTxt').onclick=function(){var v=document.getElementById('txt').value;if(v){post('/api/text',{text:v});toast('已发送：'+v)}};
document.getElementById('save').onclick=function(){
  post('/api/settings',{
    session_limit_minutes:+document.getElementById('session').value,
    rest_minutes:+document.getElementById('rest').value,
    daily_limit_minutes:+document.getElementById('daily').value,
    quiz_interval_minutes:+document.getElementById('limit').value,
    reboot_time:document.getElementById('rtime').value,
    daily_reset_time:document.getElementById('drtime').value,
    reboot_enabled:document.getElementById('rebootOn').checked,
    reboot_days:(function(){var a=[];[].forEach.call(document.querySelectorAll('#days input:checked'),function(x){a.push(+x.value)});return a})(),
    control_enabled:document.getElementById('controlOn').checked,
    voice_enabled:document.getElementById('voiceOn').checked,
    lock_voice_enabled:document.getElementById('lockVoiceOn').checked,
    pause_on_no_playback:document.getElementById('pauseOnNoPlay').checked,
    quiz_enabled:document.getElementById('quizOn').checked,
    weather_enabled:document.getElementById('weatherOn').checked,
    weather_city_code:(document.getElementById('weatherCode').value.trim()||document.getElementById('weatherCity').value||''),
    weather_city_name:(function(){var s=document.getElementById('weatherCity');return s.selectedIndex>=0?s.options[s.selectedIndex].text:''})()})
  .then(function(r){toast(r.ok?'设置已保存':r.msg);if(r.ok)clearDirty();setTimeout(loadWeather,1200)});
};
document.getElementById('btnQuiz').onclick=function(){post('/api/start_quiz',{}).then(function(r){toast(r.ok?'已出题':r.msg)})};
document.getElementById('btnReset').onclick=function(){post('/api/reset_timer',{}).then(function(r){toast(r.ok?'计时与惩罚次数已重置':r.msg)})};
document.getElementById('btnUnlock').onclick=function(){post('/api/force_unlock',{}).then(function(r){toast(r.ok?'已跳过本题':r.msg)})};
document.getElementById('btnReboot').onclick=function(){if(!confirm('确定立即重启电视盒子？'))return;post('/api/reboot',{}).then(function(r){toast(r.ok?'正在重启':r.msg)})};
document.getElementById('btnSpeak').onclick=function(){post('/api/speak',{}).then(function(){toast('已重播题目')})};
document.getElementById('btnFindRemote').onclick=function(){post('/api/find_remote',{}).then(function(r){toast(r.ok?'遥控器正在响，仔细听～':(r.msg||'触发失败'))})};
document.getElementById('btnLock').onclick=function(){post('/api/lock',{}).then(function(r){toast(r.ok?'电视已锁定':r.msg);refresh()})};
document.getElementById('btnUnlockAll').onclick=function(){
  if(this.disabled)return;
  post('/api/unlock',{}).then(function(r){toast(r.msg||(r.ok?'已解锁':'操作失败'));refresh()});
};
document.getElementById('volUp').onclick=function(){post('/api/key',{key:'VOL_UP'});setTimeout(refresh,600)};
document.getElementById('volDown').onclick=function(){post('/api/key',{key:'VOL_DOWN'});setTimeout(refresh,600)};
document.getElementById('btnTimerPause').onclick=function(){
  var paused=!(S.timer_paused===true);
  post('/api/timer_pause',{paused:paused}).then(function(r){toast(paused?'已暂停计时，不再累计':'已恢复计时');refresh()});
};
function answer(c){post('/api/answer',{choice:c}).then(function(r){
  toast(r.msg||(r.correct?'答对啦':'再想想哦'));refresh();})}
var SETTING_INPUTS=['session','rest','daily','limit','rtime','drtime','weatherCode'];
var SETTING_CHECKS=['rebootOn','controlOn','voiceOn','lockVoiceOn','quizOn','pauseOnNoPlay','weatherOn'];
function fill(id,v){
  var e=document.getElementById(id);
  if(!e||document.activeElement===e||e.getAttribute('data-dirty')==='1')return;
  e.value=(v==null?'':v);
}
function setChk(id,v){
  var e=document.getElementById(id);
  if(!e||e.getAttribute('data-dirty')==='1')return;
  e.checked=!!v;
}
function clearDirty(){
  SETTING_INPUTS.concat(SETTING_CHECKS).forEach(function(id){
    var e=document.getElementById(id);if(e)e.removeAttribute('data-dirty');
  });
  [].forEach.call(document.querySelectorAll('#days input'),function(x){x.removeAttribute('data-dirty')});
}
function fillSettings(s){
  fill('session',s.session_limit_minutes);
  fill('rest',s.rest_minutes);
  fill('daily',s.daily_limit_minutes);
  fill('limit',s.quiz_interval_minutes);
  fill('rtime',s.reboot_time||'01:00');
  fill('drtime',s.daily_reset_time||'06:00');
  setChk('pauseOnNoPlay',s.pause_on_no_playback);
  setChk('rebootOn',s.reboot_enabled);
  var rd=s.reboot_days||[7];
  [].forEach.call(document.querySelectorAll('#days input'),function(x){
    if(x.getAttribute('data-dirty')!=='1')x.checked=rd.indexOf(+x.value)>=0;
  });
  setChk('controlOn',s.control_enabled);
  setChk('voiceOn',s.voice_enabled);
  setChk('lockVoiceOn',s.lock_voice_enabled);
  setChk('quizOn',s.quiz_enabled);
}
function refresh(){ TVCTL.pollNow(); }
function render(s){
    fillSettings(s);   // 先回填设置：后续任何 DOM 异常都不影响表单
    S=s;
    if(s.locked&&!S_prevLocked&&(!document.activeElement||document.activeElement.tagName!=='INPUT')){
      if(typeof switchTab==='function')switchTab('control');toast('到答题时间了');}
    S_prevLocked=!!s.locked;
    document.getElementById('sessionLeft').innerHTML=Math.ceil(s.session_remaining_seconds/60)+'<small> 分钟</small>';
    document.getElementById('todayLeft').innerHTML=Math.ceil(s.today_remaining_seconds/60)+'<small> 分钟</small>';
    document.getElementById('bar').style.width=Math.min(100,s.session_seconds/(s.session_limit_minutes*60)*100)+'%';
    document.getElementById('note').textContent=s.note||'计时进行中';
    var ST=stateOf(s);
    document.getElementById('subStatus').textContent='本次已看 '+mm(s.session_seconds)+' 分钟 · 今日已看 '+mm(s.today_seconds)+' 分钟 · 距下一题 '+Math.ceil(s.quiz_remaining_seconds/60)+' 分钟 · '+ST.playText+' · '+ST.detail+(s.failed_questions?(' · 本轮累计答错 '+s.failed_questions+'/3'):'')+(s.penalty_count?(' · 已惩罚 '+s.penalty_count+' 次，下次 '+s.next_penalty_minutes+' 分钟'):'');
    var sys=s.system||{};
    document.getElementById('sysPlay').textContent = ST.playText;
    document.getElementById('sysPlaySub').textContent = ST.detail;
    document.getElementById('sysTimer').textContent = ST.timerText;
    document.getElementById('sysTimerSub').textContent = s.timer_paused?'点上方按钮恢复':'按播放状态自动累计';
    var vol=(sys.volume==null?'--':sys.volume), vmax=sys.volume_max||15;
    document.getElementById('sysVol').textContent = sys.muted?'静音':(vol+' / '+vmax);
    document.getElementById('sysVolBar').style.width = (sys.volume_percent||0)+'%';
    var nt=sys.network_type||'none';
    var netTxt = !sys.network_online ? '未联网'
      : (nt==='wifi'?'Wi-Fi 已连接':(nt==='ethernet'?'有线已连接':(nt==='mobile'?'移动网络':'已联网')));
    document.getElementById('sysNet').textContent = netTxt;
    document.getElementById('sysIp').textContent = sys.ip||'';
    var mem=sys.memory||{}, mr=document.getElementById('memRow');
    if(mem.total_mb){
      mr.style.display='flex';
      var ap=mem.avail_percent||0;
      document.getElementById('sysMem').textContent=(mem.avail_mb||0)+' / '+(mem.total_mb||0)+' MB';
      var mb=document.getElementById('sysMemBar');
      mb.style.width=Math.max(2,100-ap)+'%';
      mb.style.background=ap<10?'var(--red)':(ap<20?'var(--amber)':'var(--green)');
      document.getElementById('sysMemSub').textContent='可用 '+(mem.avail_mb||0)+' MB（'+ap+'%）· 已用 '+(mem.used_mb||0)+' MB'
        +(mem.swap_total_mb?(' · 交换 '+(mem.swap_used_mb||0)+' / '+mem.swap_total_mb+' MB'):'');
    }else{mr.style.display='none';document.getElementById('sysMemSub').textContent=''}
    var tr=document.getElementById('trafficRow');
    if(sys.traffic_supported){
      tr.style.display='flex';
      document.getElementById('sysTraffic').textContent='↓ '+fmtRate(sys.net_rx_bps||0)+'   ↑ '+fmtRate(sys.net_tx_bps||0);
      document.getElementById('sysTrafficTotal').textContent='开机以来：接收 '+fmtTotal(sys.net_rx_total||0)+' · 发送 '+fmtTotal(sys.net_tx_total||0);
    }else{tr.style.display='none';document.getElementById('sysTrafficTotal').textContent=''}
    var sp=document.getElementById('sysPill'), lp=document.getElementById('lockPill');
    sp.textContent=ST.pill[0];sp.className=ST.pill[1];
    lp.textContent=ST.pill[0];lp.className=ST.pill[1];
    var ub=document.getElementById('btnUnlockAll');
    var canUnlock=!!(s.hard_locked&&s.lock_reason);
    ub.disabled=!canUnlock;
    var UTIPS={manual:'解除手动锁定。',penalty:'清除惩罚并重新出题。',
              rest:'结束本次休息。',daily:'放行本轮一次。'};
    document.getElementById('unlockTip').textContent=canUnlock
      ?(UTIPS[s.lock_reason]||'解锁电视。')
      :'当前无需解锁。一键锁定只能用手机解除。';
    var hb=document.getElementById('hardLockBox');
    if(s.hard_locked){
      hb.style.display='block';
      var titles={manual:'电视已锁定',penalty:'答错太多啦',rest:'休息时间到啦',daily:'今天看够啦'};
      document.getElementById('hardTitle').textContent=titles[s.lock_reason]||'电视已锁定';
      var body='';
      if(s.lock_reason==='manual')body='遥控器全部按键无效，点上方「解锁电视」即可继续。';
      else if(s.lock_reason==='penalty')body='第 '+s.penalty_count+' 次惩罚 · 还需休息 '+Math.floor(s.penalty_remaining_seconds/60)+' 分 '+(s.penalty_remaining_seconds%60)+' 秒，之后自动重新出题。';
      else if(s.lock_reason==='rest')body='还需休息 '+Math.ceil(s.rest_remaining_seconds/60)+' 分钟，到点自动解锁。';
      else if(s.lock_reason==='daily')body='今日累计已用完 · 请在手机上点「解锁电视」放行。';
      document.getElementById('hardBody').textContent=body;
    }else{hb.style.display='none'}
    var qc=document.getElementById('quizCard');
    if(s.locked&&s.quiz){
      qc.className='card quiz show';
      document.getElementById('quizSub').textContent=s.quiz.subject+(s.quiz.review?' · 错题复习':'')+' · 第 '+((s.quiz_correct||0)+1)+'/'+(s.quiz_required||2)+' 题';
      document.getElementById('qtext').textContent=s.quiz.q;
      var box=document.getElementById('opts');box.innerHTML='';
      '1234'.split('').forEach(function(L,i){
        var b=document.createElement('button');b.className='opt big';
        b.innerHTML='<b>'+L+'.</b>'+escapeHtml(String(s.quiz.options[i]));
        b.onclick=function(){answer(L)};box.appendChild(b);
      });
      document.getElementById('quizTip').textContent='本题已答错 '+s.wrong+'/2 次 · 错 2 次换题，本轮累计答错 3 次要惩罚休息（'+s.next_penalty_minutes+' 分钟）';
    }else{qc.className='card quiz'}
    var tpb=document.getElementById('btnTimerPause');
    if(s.timer_paused){tpb.className='unlock';tpb.textContent='计时已暂停 · 点此恢复计时'}
    else{tpb.className='warn';tpb.textContent='暂停计时（关电视 / 暂停时点一下）'}
}
function escapeHtml(t){return t.replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
var TABS=['control','remote','settings'];
var S_prevLocked=false;
function switchTab(t,noScroll){
  if(TABS.indexOf(t)<0)t='control';
  for(var i=0;i<TABS.length;i++){
    var pg=document.getElementById('page-'+TABS[i]);
    if(pg)pg.className='page'+(TABS[i]===t?' on':'');
  }
  var nav=document.getElementById('tabsNav');
  if(nav){
    var btns=nav.getElementsByTagName('button');
    for(var j=0;j<btns.length;j++){
      btns[j].className=(btns[j].getAttribute('data-tab')===t?'on':'');
    }
  }
  if(!noScroll){try{window.scrollTo(0,0)}catch(e){}}
}
(function(){
  var nav=document.getElementById('tabsNav');
  if(nav){
    nav.addEventListener('click',function(e){
      var n=e.target;
      while(n&&n!==nav&&!(n.getAttribute&&n.getAttribute('data-tab'))){n=n.parentNode}
      var t=(n&&n.getAttribute)?n.getAttribute('data-tab'):null;
      if(!t)return;
      if(t==='bank'){location.href='/bank';return}
      switchTab(t);
    });
  }
  var m=(location.search||'').match(/[?&]tab=(control|remote|settings|bank)/);
  if(m&&m[1]==='bank'){location.replace('/bank');return}
  var h=(location.hash||'').replace('#','');
  switchTab(m?m[1]:(TABS.indexOf(h)>=0?h:'control'),true);
})();
function loadWeather(){
  fetch('/api/weather').then(function(r){return r.json()}).then(function(d){
    var sel=document.getElementById('weatherCity');
    if(!sel)return;
    if(sel.options.length===0){
      var o0=document.createElement('option');o0.value='';o0.textContent='选择城市';sel.appendChild(o0);
      (d.cities||[]).forEach(function(c){
        var o=document.createElement('option');o.value=c.code;o.textContent=c.name;sel.appendChild(o);
      });
    }
    var code=d.city_code||'';
    if(document.activeElement!==sel&&code)sel.value=code;
    document.getElementById('weatherOn').checked=!!d.enabled;
    var cur=d.current||{},days=d.days||[],txt;
    if(d.ok)txt=(d.city||'')+' '+(cur.temp||'--')+'° '+(days[0]?days[0].type:'')+' · '+days.length+' 天';
    else txt=d.error||'天气加载中';
    if(d.stale)txt+='（缓存）';
    document.getElementById('weatherNow').value=txt;
  }).catch(function(){document.getElementById('weatherNow').value='天气未连接'});
}
document.getElementById('btnWeather').onclick=function(){
  post('/api/weather_refresh',{}).then(function(){toast('正在刷新天气');setTimeout(loadWeather,2000)});
};
document.getElementById('btnLockWeather').onclick=function(){
  post('/api/lock',{}).then(function(r){toast(r.ok?'已锁定，可在控制台解锁':r.msg)});
};
SETTING_INPUTS.concat(SETTING_CHECKS).forEach(function(id){
  var e=document.getElementById(id);
  if(e)['input','change'].forEach(function(ev){
    e.addEventListener(ev,function(){e.setAttribute('data-dirty','1')});
  });
});
[].forEach.call(document.querySelectorAll('#days input'),function(x){
  x.addEventListener('change',function(){x.setAttribute('data-dirty','1')});
});
TVCTL.init(render);
loadWeather();
</script>
